<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link href="fontawesome/css/all.css" rel="stylesheet" />
    <title>ABICAP</title>

    <link rel="stylesheet" type="text/css" href="./css/richardCss.css">
    <title>Agendamento</title>
    <style>
        body {
            background-color: #27408B;
        }
    </style>
</head>

<body class="body">
    <a id="topo"></a>

    <nav class="navbar fixed-top navbar-expand-lg" style="background-color: #191970;">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
                aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarText">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link text-light" href="./index.html"><i class="fa-solid fa-car text-light"></i> ABICAP</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active text-light" href="./agendamentos.html"><i class="fa-regular fa-calendar text-light"></i> Agendamentos</a>
                    </li>
                </ul>
                <span class="navbar-text">
                        <a class="nav-link text-light" href="./views/login.html"><i class="fa-regular fa-user text-light"></i> | Login</a>
                </span>
            </div>
        </div>
    </nav>

    <div id="carouselExampleCaptions" style="margin-top: 100px; margin-bottom: 50px; width: 70%; height: 50%;" class="carousel slide mx-auto" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"
                aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2"
                aria-label="Slide 3"></button>
        </div>

        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="./imagens/eletroposto1.jpg" class="d-block w-100" alt="Planets Discovery">
                <div class="carousel-caption d-none d-md-block">
                    <h5>ABICAP</h5>
                    <p>The future in charging.</p>
                </div>
            </div>

            <div class="carousel-item">
                <img src="./imagens/eletroposto2.jpeg" class="d-block w-100" alt="Planets">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Eletropostos</h5>
                    <p>Localização e disponibilidade.</p>
                </div>
            </div>

            <div class="carousel-item">
                <img src="./imagens/eletroposto3.png" class="d-block w-100" alt="Starships">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Agendamento</h5>
                    <p>Atendimento e exclusividade.</p>
                </div>
            </div>
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions"
            data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <h2 id="meio" class="text-center text-white mt-5">Agendamentos</h2>

    <p class="text-center text-white">
        Aqui você pode realizar seus agendamentos para carregamento.
    </p>

    <p class="text-center" style="margin-bottom: 50px;">
        <a href="#topo" class="btn btn-light">Voltar ao topo</a>
    </p>

    <footer class="fixed-bottom">
        <p class="text-light text-center">2026 - ABICAP</p>
    </footer>

    <script src="js/bootstrap.bundle.min.js"></script>
